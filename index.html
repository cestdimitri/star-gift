<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>18 сентября 1971</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22><circle cx=%225%22 cy=%225%22 r=%221%22 fill=%22%23e9e4d8%22/></svg>">
<style>
  :root{
    --bg-top:#05060d;
    --bg-bottom:#141225;
    --ink:#e9e4d8;
    --ink-dim:#a79f8f;
    --ink-faint:#8a8375;
    --gold:#b9985a;
    --ochre:#c98f4a;
    --blue:#4b6fa5;
    --green:#4c5a44;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html{
    background: var(--bg-top);
  }
  html,body{
    margin:0; padding:0;
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', Times, serif;
    font-size:17px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  body{
    position:relative;
    overflow-x:hidden;
    background: transparent;
  }
  ::selection{ background: rgba(185,152,90,.35); }

  a{ color: var(--gold); }

  .section{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
  }

  /* ---------- небо ---------- */

  .sky-section{
    padding: 0;
    overflow:hidden;
    background: radial-gradient(120% 80% at 50% 100%, #1b1a33 0%, #0a0a16 55%, #05050c 100%);
  }
  #sky-canvas{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    display:block;
  }
  .sky-caption{
    position:absolute;
    left:0; right:0;
    bottom: 150px;
    text-align:center;
    font-size: 13px;
    letter-spacing:.02em;
    color: var(--ink-faint);
    padding: 0 24px;
    z-index:3;
    pointer-events:none;
    text-shadow: 0 1px 6px rgba(5,5,12,.9), 0 0 14px rgba(5,5,12,.6);
  }
  .hour-control{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding: 14px 24px calc(18px + env(safe-area-inset-bottom,0px));
    background: linear-gradient(to top, rgba(5,5,12,.85), rgba(5,5,12,0));
  }
  .sky-playback{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:2px;
  }
  .playback-btn{
    -webkit-appearance:none;
    appearance:none;
    background:transparent;
    border:1px solid rgba(233,228,216,.25);
    color: var(--ink-dim);
    font-family: Georgia, serif;
    font-size:13px;
    width:44px; height:44px;
    min-width:44px; min-height:44px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: border-color .3s ease, color .3s ease, opacity .3s ease;
  }
  .playback-btn:hover{ border-color: rgba(233,228,216,.5); color: var(--ink); }
  .playback-btn:disabled{ opacity:.35; cursor:default; }
  .playback-btn-sm{ font-size:16px; }
  .speed-label{
    font-size:12px;
    color: var(--ink-faint);
    min-width:28px;
    text-align:center;
    font-variant-numeric: tabular-nums;
    letter-spacing:.03em;
  }
  .hour-label{
    font-size:13px;
    letter-spacing:.08em;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  #hour-slider{
    -webkit-appearance:none;
    appearance:none;
    width: min(360px, 86vw);
    height: 34px;
    background:transparent;
    cursor:pointer;
  }
  #hour-slider::-webkit-slider-runnable-track{
    height:2px;
    background: linear-gradient(90deg, rgba(233,228,216,.08), rgba(233,228,216,.35), rgba(233,228,216,.08));
  }
  #hour-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px; height:15px;
    margin-top:-6.5px;
    border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 8px rgba(185,152,90,.7);
  }
  #hour-slider::-moz-range-track{
    height:2px;
    background: rgba(233,228,216,.2);
  }
  #hour-slider::-moz-range-thumb{
    width:15px; height:15px;
    border:none;
    border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 8px rgba(185,152,90,.7);
  }

  /* ---------- прогноз дня ---------- */

  .forecast-section{
    align-items:stretch;
    text-align:left;
    /* Секция по высоте содержимого, а не во весь экран: с коротким текстом
       из источника под ним оставалась пустая полоса почти в треть экрана.
       Кнопка звука больше не мешает — она появляется только у финала. */
    min-height: auto;
    padding: 76px 26px 52px;
    gap: 0;
  }
  /* Сад растёт на фоне всей страницы, и подросшие стебли лезли прямо под
     строки прогноза. Мягкое затемнение по центру секции возвращает
     читаемость, а по краям растворяется — растения остаются видны. */
  .forecast-section::before{
    content:'';
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    background: radial-gradient(125% 62% at 50% 50%,
      rgba(5,6,13,.94) 38%, rgba(5,6,13,.72) 68%, rgba(5,6,13,0) 100%);
  }
  .forecast-wrap{
    position:relative;
    z-index:1;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .forecast-date{
    font-size: 13px;
    letter-spacing:.06em;
    color: var(--ink-faint);
    text-align:center;
    margin-bottom: 28px;
  }
  .forecast-birthday{
    font-size: 1.05em;
    line-height:1.8;
    text-align:center;
    color: var(--ink);
  }
  .forecast-theme{
    padding: 18px 0;
    border-top: 1px solid rgba(233,228,216,.1);
  }
  .forecast-theme:first-of-type{ border-top: none; }
  .forecast-theme-name{
    font-size: 12.5px;
    letter-spacing:.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 8px;
  }
  .forecast-theme-text{
    margin: 0;
    line-height:1.7;
  }
  .forecast-dowords{
    display:flex;
    gap: 28px;
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid rgba(233,228,216,.1);
  }
  .forecast-dowords > div{ flex:1; min-width:0; }
  /* в две колонки по 150px русские фразы рвутся на три строки и сливаются
     друг с другом — на телефоне списки идут один под другим */
  @media (max-width: 460px){
    .forecast-dowords{ flex-direction:column; gap:24px; }
  }
  .forecast-dowords h3{
    font-size: 11.5px;
    letter-spacing:.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: normal;
    margin: 0 0 8px;
  }
  .forecast-dowords ul{
    list-style: none;
    margin: 0; padding: 0;
    font-size: .95em;
    color: var(--ink-dim);
    line-height:1.55;
  }
  /* без этого отступа пункт из двух строк слипается со следующим */
  .forecast-dowords li{ margin-bottom: 10px; }
  .forecast-dowords li:last-child{ margin-bottom: 0; }
  .forecast-daily{
    margin: 0;
    font-size: 1.06em;
    line-height: 1.8;
  }
  .forecast-source{
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--ink-faint);
    line-height:1.6;
  }
  .forecast-source a{ color: var(--ink-faint); text-decoration: underline; }
  .forecast-source a:hover{ color: var(--ink-dim); }
  .forecast-small{
    margin-top: 26px;
    font-size: 13px;
    color: var(--ink-faint);
    line-height:1.7;
    font-style: italic;
  }
  .forecast-actions{
    display:flex;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .forecast-footnote{
    margin-top: 34px;
    font-size: 12.5px;
    color: var(--ink-faint);
    line-height:1.6;
  }
  .ghost-btn{
    -webkit-appearance:none;
    appearance:none;
    background:transparent;
    border:1px solid rgba(233,228,216,.28);
    color: var(--ink-dim);
    font-family: Georgia, serif;
    font-size:13px;
    letter-spacing:.06em;
    padding: 12px 20px;
    min-height:44px;
    border-radius:2px;
    cursor:pointer;
    transition: border-color .3s ease, color .3s ease;
  }
  .ghost-btn:hover{ border-color: rgba(233,228,216,.55); color: var(--ink); }
  .ghost-btn[hidden]{ display:none; }

  /* ---------- сад ---------- */

  #garden-canvas{
    position:fixed;
    inset:0;
    width:100vw; height:100vh;
    z-index:-1;
    pointer-events:none;
    display:block;
  }


  /* ---------- музыка ---------- */

  .sound-toggle{
    position:fixed;
    right: max(16px, env(safe-area-inset-right,0px));
    bottom: max(16px, env(safe-area-inset-bottom,0px));
    z-index:50;
    display:flex;
    align-items:center;
    gap:7px;
    -webkit-appearance:none;
    appearance:none;
    background: rgba(10,10,18,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border:1px solid rgba(233,228,216,.2);
    color: var(--ink-faint);
    font-family: Georgia, serif;
    font-size:11px;
    letter-spacing:.08em;
    padding: 10px 14px;
    min-height:44px;
    border-radius:999px;
    cursor:pointer;
    opacity:.55;
    transition: opacity .4s ease, border-color .4s ease, color .4s ease, transform .4s ease;
  }
  /* пока небо занимает экран, кнопка убрана — она перекрывала ползунок часа */
  .sound-toggle.is-tucked{
    opacity:0;
    pointer-events:none;
    transform: translateY(12px);
  }
  .sound-toggle:hover,
  .sound-toggle[aria-pressed="true"]{
    opacity:1;
    border-color: rgba(233,228,216,.4);
    color: var(--ink-dim);
  }
  .sound-icon{ font-size:13px; line-height:1; }
  .sound-toggle[aria-pressed="true"] .sound-icon{ color: var(--gold); }
  .sound-toggle[hidden]{ display:none; }

  /* Финал не занимает целый экран: под прогнозом оставалась пустая
     полоса высотой во весь телефон. Хватает места для сада по краям. */
  #end-section{
    min-height: 44vh;
    min-height: 44dvh;
    padding-top: 8px;
    padding-bottom: 28px;
  }
  .music-viz{
    width: min(90vw, 520px);
    height: 108px;
    display:block;
    margin: 0 auto;
  }
  .music-dots{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap: 31px;
    max-width: 420px;
    margin: 4px auto 0;
    padding: 0;
  }
  @media (max-width: 460px){
    /* ряд из десяти на телефон не влезает, а 9+1 выглядит случайностью:
       ограничиваем ширину так, чтобы вышло ровно пять и пять */
    .music-dots{ max-width: 200px; }
  }
  .music-dot{
    -webkit-appearance:none;
    appearance:none;
    width:13px; height:13px;
    min-width:13px; min-height:13px;
    border-radius:50%;
    border:1px solid rgba(233,228,216,.3);
    background: rgba(233,228,216,.08);
    padding:0;
    cursor:pointer;
    position:relative;
    transition: background .3s ease, border-color .3s ease, transform .2s ease;
  }
  .music-dot::before{
    /* зона нажатия 43x43 — при gap:31px соседние зоны не наезжают */
    content:'';
    position:absolute;
    inset:-15px;
  }
  .music-dot:hover,
  .music-dot:active{
    background: var(--gold);
    border-color: var(--gold);
    transform: scale(1.15);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; }
  }
</style>
</head>
<body>

<noscript>
  <p style="max-width:34em;margin:14vh auto;padding:0 24px;text-align:center;color:#a79f8f;line-height:1.75;">
    Небо, сад и музыка на этой странице рисуются на ходу, поэтому им нужен включённый JavaScript.
  </p>
</noscript>

<main>

  <section id="sky-section" class="section sky-section" aria-label="Небо в ночь рождения">
    <canvas id="sky-canvas"></canvas>

    <div class="sky-caption" id="sky-caption">18 сентября 1971 года, село Кленовское, 56°49′ с.ш. 58°37′ в.д. Луны в ту ночь не было.</div>

    <div class="hour-control">
      <div class="sky-playback">
        <button id="play-pause-btn" class="playback-btn" type="button" aria-label="Пауза">
          <span id="play-pause-icon">❚❚</span>
        </button>
        <button id="speed-down-btn" class="playback-btn playback-btn-sm" type="button" aria-label="Медленнее">−</button>
        <span class="speed-label" id="speed-label">1×</span>
        <button id="speed-up-btn" class="playback-btn playback-btn-sm" type="button" aria-label="Быстрее">+</button>
      </div>
      <div class="hour-label" id="hour-label">21:00</div>
      <input type="range" id="hour-slider" min="19" max="29" step="0.05" value="21" aria-label="Час ночи">
    </div>
  </section>

  <section id="forecast-section" class="section forecast-section" aria-label="Прогноз дня">
    <div class="forecast-wrap">
      <div class="forecast-date" id="forecast-date"></div>
      <div id="forecast-body"><p class="forecast-theme-text">Прогноз складывается при открытии страницы.</p></div>
      <div class="forecast-actions">
        <button id="forecast-save-dark" class="ghost-btn" type="button">сохранить</button>
        <button id="forecast-save-light" class="ghost-btn" type="button">для печати</button>
      </div>
      <p class="forecast-footnote">Интонация собрана по записным книжкам Чехова и ранним дневникам Толстого.</p>
    </div>
  </section>

  <!-- GARDEN NOTE: сад рисуется отдельным fixed canvas ниже, вне потока -->

  <section id="end-section" class="section" aria-label="Финал">
    <canvas id="music-viz" class="music-viz" aria-hidden="true"></canvas>
    <div class="music-dots" id="music-dots"></div>
  </section>

</main>

<canvas id="garden-canvas" aria-hidden="true"></canvas>

<button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" hidden>
  <span class="sound-icon" aria-hidden="true">♪</span>
  <span class="sound-text">звук</span>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

    document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"><\/scr' + 'ipt>');
  }
</script>

<script>
'use strict';

/* ============================================================
   Общая инфраструктура: один rAF-цикл, реестр тикеров,
   пауза при document.hidden и prefers-reduced-motion.
   ============================================================ */

const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const tickers = [];
function registerTicker(fn){ tickers.push(fn); return fn; }
function unregisterTicker(fn){
  const i = tickers.indexOf(fn);
  if (i >= 0) tickers.splice(i, 1);
}

let lastTs = 0;
function mainLoop(ts){
  if (!document.hidden){
    // dt ограничен: после сворачивания вкладки или лага не должно быть скачка
    const dt = lastTs ? Math.min(ts - lastTs, 100) : 16.7;
    lastTs = ts;
    // идём с конца: снятие упавшего тикера не пропускает соседний
    for (let i = tickers.length - 1; i >= 0; i--){
      try { tickers[i](ts, dt); }
      catch(e){ console.error('[ticker error]', e); unregisterTicker(tickers[i]); }
    }
  } else {
    lastTs = 0;
  }
  requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);

function safeInit(name, fn){
  try { fn(); }
  catch(e){ console.error('[block failed: ' + name + ']', e); }
}

/* ============================================================
   Небо
   ============================================================ */

safeInit('sky', function(){
  const canvas = document.getElementById('sky-canvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('hour-slider');
  const label = document.getElementById('hour-label');
  const section = document.getElementById('sky-section');
  const playBtn = document.getElementById('play-pause-btn');
  const playIcon = document.getElementById('play-pause-icon');
  const speedDownBtn = document.getElementById('speed-down-btn');
  const speedUpBtn = document.getElementById('speed-up-btn');
  const speedLabel = document.getElementById('speed-label');

  let visible = true;
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => { visible = en.isIntersecting; });
    }, { threshold: 0.05 });
    io.observe(section);
  }

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0, compassR = 0, bgR = 0;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = section.clientWidth;
    H = section.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
    // сфера увеличена и растянута за пределы экрана — видимой границы круга нет
    R = Math.max(W, H) * 0.60;
    compassR = Math.min(W, H) * 0.46;
    bgR = Math.hypot(W, H) / 2 * 1.05;
    // фон пересобирается только здесь, а не в каждом кадре
    bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, bgR);
    bgGradient.addColorStop(0, '#0c0c1c');
    bgGradient.addColorStop(0.55, '#111227');
    bgGradient.addColorStop(0.88, '#1c1c36');
    bgGradient.addColorStop(1, '#232342');
  }
  let bgGradient = null;
  resize();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resize();
      // изменение размера очищает канвас: если анимация стоит, нужно вернуть картинку
      if (!isPlaying || REDUCED_MOTION) draw(performance.now());
    }, 120);
  });

  // юлианская дата: годы/месяц/день + локальный час минус смещение пояса -> UTC
  function julianDate(y, mo, d, localHourFloat, tzOffset){
    const utcHour = localHourFloat - tzOffset;
    const ms = Date.UTC(y, mo - 1, d, 0, 0, 0, 0) + utcHour * 3600000;
    return ms / 86400000 + 2440587.5;
  }

  function gmstDeg(jd){
    const T = (jd - 2451545.0) / 36525;
    let g = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T;
    g = g % 360;
    if (g < 0) g += 360;
    return g;
  }

  const latR = DATA.lat * Math.PI / 180;
  const sinLat = Math.sin(latR), cosLat = Math.cos(latR);
  const era = { year: 1971, month: 9, day: 18, tzOffset: DATA.tzOffset, lon: DATA.lon };

  function altAz(raDeg, decDeg, lst){
    let H = lst - raDeg;
    H = ((H % 360) + 360) % 360;
    if (H > 180) H -= 360;
    const Hr = H * Math.PI / 180;
    const decR = decDeg * Math.PI / 180;
    const sinAlt = Math.sin(decR) * sinLat + Math.cos(decR) * cosLat * Math.cos(Hr);
    const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) * 180 / Math.PI;
    const az = Math.atan2(
      -Math.sin(Hr) * Math.cos(decR),
      Math.sin(decR) * cosLat - Math.cos(decR) * sinLat * Math.cos(Hr)
    ) * 180 / Math.PI;
    return [alt, (az + 360) % 360];

  // это зеркально обычной карте «сверху вниз», поэтому x идёт со знаком минус
  function project(alt, az){
    const r = R * (90 - alt) / 90;
    const a = az * Math.PI / 180;
    return [cx - r * Math.sin(a), cy - r * Math.cos(a)];
  }

  const CLASS_TINT = {
    B: [190, 205, 255],
    A: [225, 230, 255],
    F: [255, 250, 240],
    G: [255, 244, 214],
    K: [255, 214, 170],
    M: [255, 180, 140]
  };

  // всё, что зависит только от самой звезды, считается один раз:
  // в кадре остаются лишь часовой угол и проекция
  const twPhase = new Float32Array(STARS.length);
  const twSpeed = new Float32Array(STARS.length);
  const sinDec = new Float32Array(STARS.length);
  const cosDec = new Float32Array(STARS.length);
  const starR = new Float32Array(STARS.length);
  const starAlpha = new Float32Array(STARS.length);
  const starTint = new Array(STARS.length);
  for (let i = 0; i < STARS.length; i++){
    twPhase[i] = (i * 12.9898) % (Math.PI * 2);
    twSpeed[i] = 0.4 + ((i * 37) % 100) / 100 * 0.6;
    const decR = STARS[i][1] * Math.PI / 180;
    sinDec[i] = Math.sin(decR);
    cosDec[i] = Math.cos(decR);
    const mag = STARS[i][2];
    starR[i] = Math.max(0.4, 2.6 - 0.32 * mag);
    starAlpha[i] = Math.max(0.15, Math.min(1, 1.15 - mag / 7));
    const tint = CLASS_TINT[STARS[i][3]] || CLASS_TINT.G;
    starTint[i] = 'rgba(' + tint[0] + ',' + tint[1] + ',' + tint[2] + ',';
  }

  // ---------- автовоспроизведение времени ----------
  const SPEED_STEPS = [0.25, 0.5, 1, 2, 4];
  let speedIdx = 2;
  let isPlaying = true;
  let hourFloat = parseFloat(slider.value);
  const CYCLE_MS = 180000; // полный проход 19:00 -> 05:00 за 3 минуты на 1×
  const HOUR_SPAN = 10;

  function updateSpeedLabel(){
    if (speedLabel) speedLabel.textContent = SPEED_STEPS[speedIdx] + '×';
    if (speedDownBtn) speedDownBtn.disabled = speedIdx === 0;
    if (speedUpBtn) speedUpBtn.disabled = speedIdx === SPEED_STEPS.length - 1;
  }
  updateSpeedLabel();

  function setPlaying(next){
    isPlaying = next;
    if (playIcon) playIcon.textContent = isPlaying ? '❚❚' : '▶';
    if (playBtn) playBtn.setAttribute('aria-label', isPlaying ? 'Пауза' : 'Воспроизвести');
  }
  setPlaying(true);

  if (playBtn) playBtn.addEventListener('click', () => setPlaying(!isPlaying));
  if (speedDownBtn) speedDownBtn.addEventListener('click', () => {
    speedIdx = Math.max(0, speedIdx - 1);
    updateSpeedLabel();
  });
  if (speedUpBtn) speedUpBtn.addEventListener('click', () => {
    speedIdx = Math.min(SPEED_STEPS.length - 1, speedIdx + 1);
    updateSpeedLabel();
  });

  slider.addEventListener('input', () => {
    // взяли управление шкалой вручную — автоплей приостанавливается
    if (isPlaying) setPlaying(false);
    hourFloat = parseFloat(slider.value);
    if (visible) draw(performance.now());
  });

  const namedToDraw = [];
  let lastLabelText = '';

  function draw(nowMs){
    if (!visible) return;
    let hh = hourFloat;
    let d = era.day;
    if (hh >= 24){ hh -= 24; d = era.day + 1; }
    const hi = Math.floor(hh);
    const mi = Math.round((hh - hi) * 60);
    const labelText = (hi < 10 ? '0' : '') + hi + ':' + (mi < 10 ? '0' : '') + mi;
    if (labelText !== lastLabelText){       // запись в DOM только при смене минуты
      lastLabelText = labelText;
      label.textContent = labelText;
    }

    const jd = julianDate(era.year, era.month, d, hh, era.tzOffset);
    const lst = (gmstDeg(jd) + era.lon + 360) % 360;

    ctx.clearRect(0, 0, W, H);

    // фон: тёмный сине-фиолетовый градиент, светлее к горизонту — покрывает весь экран
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, W, H);

    // короткий вдох-затухание на стыке цикла (новая ночь начинается)
    const distToEdge = Math.min(hourFloat - 19, 19 + HOUR_SPAN - hourFloat);

    ctx.lineWidth = 1;

      const [p1, p2] = CONLINES[i];
      const [alt1, az1] = altAz(p1[0], p1[1], lst);
      const [alt2, az2] = altAz(p2[0], p2[1], lst);
      if (alt1 < -2 || alt2 < -2) continue;
      const a = project(Math.max(alt1,0), az1);
      const b = project(Math.max(alt2,0), az2);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }

    // звёзды
    const tSec = nowMs / 1000;
    namedToDraw.length = 0;
    const DEG = Math.PI / 180;
    for (let i = 0; i < STARS.length; i++){
      const s = STARS[i];

      // часовой угол и высота — единственное, что меняется от кадра к кадру
      let Hdeg = lst - s[0];
      Hdeg = ((Hdeg % 360) + 360) % 360;
      if (Hdeg > 180) Hdeg -= 360;
      const Hr = Hdeg * DEG;
      const cosHr = Math.cos(Hr);
      const sinAltV = sinDec[i] * sinLat + cosDec[i] * cosLat * cosHr;
      if (sinAltV <= 0) continue;                       // под горизонтом
      const alt = Math.asin(sinAltV > 1 ? 1 : sinAltV) / DEG;
      const azR = Math.atan2(
        -Math.sin(Hr) * cosDec[i],
        sinDec[i] * cosLat - cosDec[i] * sinLat * cosHr

      const rr = R * (90 - alt) / 90;
      const x = cx - rr * Math.sin(azR);
      const y = cy - rr * Math.cos(azR);
      if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;

      const mag = s[2];
      const r = starR[i];

      const tw = REDUCED_MOTION ? 0 : Math.sin(tSec * twSpeed[i] + twPhase[i]) * 0.15;

        glow.addColorStop(1, col + '0)');

        ctx.beginPath();
        ctx.arc(x, y, r * 5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = col + alpha + ')';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      if (s[4]){ namedToDraw.push(x, y, s[4]); }
    }

    // подписи ярких звёзд
    ctx.font = '12px Georgia, serif';
    ctx.fillStyle = 'rgba(214,206,186,' + (0.72 * seam) + ')';
    ctx.textAlign = 'left';
    for (let i = 0; i < namedToDraw.length; i += 3){
      ctx.fillText(namedToDraw[i + 2], namedToDraw[i] + 7, namedToDraw[i + 1] + 3);

    // стороны света — на фиксированном радиусе, независимом от увеличенной сферы
    ctx.font = '12px Georgia, serif';
    ctx.fillStyle = 'rgba(186,176,156,0.62)';
    ctx.textAlign = 'center';
    const compass = [['С',0],['В',90],['Ю',180],['З',270]];
    for (const [label2, az] of compass){
      const a = az * Math.PI / 180;
      const x = cx - compassR * Math.sin(a);
      const y = cy - compassR * Math.cos(a);
      ctx.fillText(label2, x, y + 4);
    }
  }

  registerTicker((ts, dt) => {
    if (!visible) return;
    if (REDUCED_MOTION){
      return;
    }
    if (isPlaying){
      hourFloat += (HOUR_SPAN / CYCLE_MS) * SPEED_STEPS[speedIdx] * dt;
      if (hourFloat >= 19 + HOUR_SPAN) hourFloat -= HOUR_SPAN;
      slider.value = hourFloat;
    }
    draw(ts);
  });

  if (REDUCED_MOTION){
    setPlaying(false);
    if (playBtn) playBtn.disabled = true;
    if (speedDownBtn) speedDownBtn.disabled = true;
    if (speedUpBtn) speedUpBtn.disabled = true;
    draw(performance.now());
  }
});

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

safeInit('forecast', function(){
  const dateEl = document.getElementById('forecast-date');
  const bodyEl = document.getElementById('forecast-body');
  const saveDarkBtn = document.getElementById('forecast-save-dark');
  const saveLightBtn = document.getElementById('forecast-save-light');

  function sinDeg(x){ return Math.sin(x * Math.PI / 180); }
  function norm360(x){ x = x % 360; if (x < 0) x += 360; return x; }

  // юлианская дата из компонентов локального времени рождения (тот же приём, что и в блоке "Небо")
  function julianDateUTC(y, mo, d, localHourFloat, tzOffset){
    const utcHour = localHourFloat - tzOffset;
    const ms = Date.UTC(y, mo - 1, d, 0, 0, 0, 0) + utcHour * 3600000;
    return ms / 86400000 + 2440587.5;
  }

  function sunLonDeg(jd){
    const n = jd - 2451545.0;
    const L = norm360(280.460 + 0.9856474 * n);
    const g = norm360(357.528 + 0.9856003 * n);
    return norm360(L + 1.915 * sinDeg(g) + 0.020 * sinDeg(2 * g));
  }

  function moonLonDeg(jd){
    const n = jd - 2451545.0;
    const Lp = 218.316 + 13.176396 * n;
    const M  = 134.963 + 13.064993 * n;
    const D  = 297.850 + 12.190749 * n;
    const F  =  93.272 + 13.229350 * n;
    const g  = norm360(357.528 + 0.9856003 * n);
    const lon = Lp + 6.289 * sinDeg(M) - 1.274 * sinDeg(2 * D - M) + 0.658 * sinDeg(2 * D)
              + 0.214 * sinDeg(2 * M) - 0.186 * sinDeg(g) - 0.114 * sinDeg(2 * F);
    return norm360(lon);
  }

  // ---------- натальное Солнце (18.09.1971, село Кленовское) — той же формулой, не хардкод ----------
  const [birthY, birthM, birthD] = DATA.birth.split('-').map(Number);
  const jdBirth = julianDateUTC(birthY, birthM, birthD, DATA.hour, DATA.tzOffset);
  const NATAL = { sunLonDeg: sunLonDeg(jdBirth) };

  // ---------- сегодня: реальный момент по часам устройства читателя ----------
  const now = new Date();
  const jdNow = Date.now() / 86400000 + 2440587.5;
  const lonSunToday = sunLonDeg(jdNow);
  const lonMoonToday = moonLonDeg(jdNow);
  const elong = norm360(lonMoonToday - lonSunToday);

  function phaseLabel(e){
    if (e < 8 || e > 352) return 'новолуние';
    if (Math.abs(e - 180) < 8) return 'полнолуние';
    return e < 180 ? 'растущая' : 'убывающая';
  }

  const ZODIAC = [
    { nom:'Овен',      prep:'Овне',      element:'fire'  },
    { nom:'Телец',     prep:'Тельце',    element:'earth' },
    { nom:'Близнецы',  prep:'Близнецах', element:'air'   },
    { nom:'Рак',       prep:'Раке',      element:'water' },
    { nom:'Лев',       prep:'Льве',      element:'fire'  },
    { nom:'Дева',      prep:'Деве',      element:'earth' },
    { nom:'Весы',      prep:'Весах',     element:'air'   },
    { nom:'Скорпион',  prep:'Скорпионе', element:'water' },
    { nom:'Стрелец',   prep:'Стрельце',  element:'fire'  },
    { nom:'Козерог',   prep:'Козероге',  element:'earth' },
    { nom:'Водолей',   prep:'Водолее',   element:'air'   },
    { nom:'Рыбы',      prep:'Рыбах',     element:'water' }
  ];
  const signIdx = Math.floor(norm360(lonMoonToday) / 30) % 12;
  const moonSign = ZODIAC[signIdx];

  function angleDiff180(a, b){
    let d = Math.abs(norm360(a - b));
    if (d > 180) d = 360 - d;
    return d;
  }
  const natalDiff = angleDiff180(lonMoonToday, NATAL.sunLonDeg);
  let aspect = 'NONE';
  if (natalDiff < 8) aspect = 'CONJ';
  else if (Math.abs(natalDiff - 60) < 6) aspect = 'SEXTILE';
  else if (Math.abs(natalDiff - 90) < 6) aspect = 'SQUARE';
  else if (Math.abs(natalDiff - 120) < 8) aspect = 'TRINE';
  else if (natalDiff > 172) aspect = 'OPPOSITION';

  // Орбисы узкие, а Луна проходит больше тринадцати градусов в сутки, поэтому
  // ни в какой аспект она не попадает почти семь дней из десяти — и столько же
  // дней подряд выпадал самый ровный набор фраз. В такие дни тон берётся по
  // фазе Луны: это та же настоящая астрономия, что и в строке под прогнозом.
  // aspect остаётся нетронутым — мелкий шрифт должен говорить правду о небе,
  // даже когда интонация выбрана по фазе.
  let tone = aspect;
  if (aspect === 'NONE'){
    if (elong < 45 || elong > 315) tone = 'CONJ';            // новолуние — начало
    else if (elong < 135) tone = 'SEXTILE';                  // растущая — можно просить
    else if (elong < 225) tone = 'OPPOSITION';               // полнолуние — про других
    else tone = 'NONE';                                      // убывающая — ровный день
  }

  const ELEMENT_THEMES = {
    fire:  ['Тело', 'Дела', 'Разговоры', 'Люди рядом'],
    earth: ['Дела', 'Дом', 'Тело', 'Тишина'],
    air:   ['Разговоры', 'Мысли', 'Люди рядом', 'Тишина'],
    water: ['Настроение', 'Люди рядом', 'Дом', 'Тишина']
  };
  const themesToday = ELEMENT_THEMES[moonSign.element];

  // номер дня по местному календарю: прогноз меняется в полночь у читателя,
  // а не в 12:00 UTC, как было бы у целой части юлианской даты
  const dayNumber = Math.floor(
    (now.getTime() - now.getTimezoneOffset() * 60000) / 86400000
  );
  const THEME_OFFSET = { 'Настроение':0, 'Мысли':1, 'Люди рядом':2, 'Дела':3, 'Тело':4, 'Дом':5, 'Разговоры':6, 'Тишина':7 };

  // Четыре фразы дня показываются подряд, и две из них, начинающиеся с одного
  // слова («Разговор с...» и «Разговор в...»), читаются как оплошность.
  // Если первое слово уже занято, сдвигаемся по тому же пулу на шаг вперёд —
  // выбор остаётся детерминированным и зависит только от номера дня.
  function firstWord(phrase){
    return phrase.toLowerCase().replace(/[^а-яёa-z\s]/g, '').trim().split(/\s+/)[0];
  }

  function pickPhrase(theme, tone, usedWords){
    const pool = FORECAST.phrases[theme][tone];
    const start = (dayNumber * 7 + THEME_OFFSET[theme] * 13) % pool.length;
    for (let k = 0; k < pool.length; k++){
      const candidate = pool[(start + k) % pool.length];
      const w = firstWord(candidate);
      if (!usedWords || !usedWords.has(w)){
        if (usedWords) usedWords.add(w);
        return candidate;
      }
    }
    return pool[start];
  }

  function pick3(poolLen, saltBase){
    // шаг +1 от детерминированной базы дня — гарантированно 3 разных индекса
    // при любой длине словаря. Соль прибавляется без умножения: при длине,
    // кратной 13, множитель обнулялся и оба столбца начинались с одного места
    const base = (dayNumber * 7 + saltBase) % poolLen;
    const res = [];
    for (let k = 0; k < 3; k++){
      res.push((base + k) % poolLen);
    }
    return res;
  }

  const doPool = FORECAST.doWords[tone];
  const avoidPool = FORECAST.avoidWords[tone];
  const doWordsToday = pick3(doPool.length, 17).map(i => doPool[i]);
  const avoidWordsToday = pick3(avoidPool.length, 41).map(i => avoidPool[i]);

  const ASPECT_RU = { CONJ:'соединение', SEXTILE:'секстиль', SQUARE:'квадратура', TRINE:'трин', OPPOSITION:'оппозиция', NONE:'без выраженного аспекта' };
  function smallPrintLine(){
    const phaseWord = phaseLabel(elong);
    // Источник обращается на «вы», собственный банк фраз — на «ты».

    return `Луна в ${moonSign.prep}, ${phaseWord}, ${ASPECT_RU[aspect]} к ${yours} Солнцу.`;
  }

  const isBirthday = (now.getMonth() === 8 && now.getDate() === 18); // сентябрь = 8 (0-индексация)

  const MONTHS_RU = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  function formatDate(d){ return `${d.getDate()} ${MONTHS_RU[d.getMonth()]} ${d.getFullYear()}`; }
  dateEl.textContent = formatDate(now);

  let themeBlocksData = null;
  let externalText = null;                       // текст из forecast.json, когда он есть
  const footnoteEl = document.querySelector('.forecast-footnote');
  const FOOTNOTE_OWN = footnoteEl ? footnoteEl.textContent : '';

  function escapeHtml(t){
    return String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  }

  function renderOwn(){
    const usedFirstWords = new Set();
    themeBlocksData = themesToday.map(theme => ({ theme, text: pickPhrase(theme, tone, usedFirstWords) }));
    let html = '';
    themeBlocksData.forEach(({ theme, text }) => {
      html += `<div class="forecast-theme"><h3 class="forecast-theme-name">${theme}</h3><p class="forecast-theme-text">${text}</p></div>`;
    });
    html += `<div class="forecast-dowords">
      <div><h3>Делать</h3><ul>${doWordsToday.map(w => `<li>${w}</li>`).join('')}</ul></div>
      <div><h3>Избегать</h3><ul>${avoidWordsToday.map(w => `<li>${w}</li>`).join('')}</ul></div>
    </div>
    <p class="forecast-small">${smallPrintLine()}</p>`;
    bodyEl.innerHTML = html;
    if (footnoteEl) footnoteEl.textContent = FOOTNOTE_OWN;
  }

  // Текст приходит из внешнего источника: его кладёт рядом со страницей
  // робот раз в сутки (tools/build-forecast.mjs). Прямо из браузера
  // гороскопные сервисы не читаются — они не отдают CORS-заголовков.
  function renderExternal(text){
    externalText = text;
    themeBlocksData = null;
    bodyEl.innerHTML = `<p class="forecast-daily">${escapeHtml(text)}</p>
    <p class="forecast-small">${smallPrintLine()}</p>
    <p class="forecast-source">Прогноз — <a href="https://ignio.com/" target="_blank" rel="noopener">ignio.com</a></p>`;
    if (footnoteEl) footnoteEl.textContent = '';
  }

  if (isBirthday){
    bodyEl.innerHTML = `<p class="forecast-birthday">${FORECAST.birthdayMessage}</p>`;
  } else {
    // Сначала рисуем свой вариант — он не требует сети и появляется мгновенно.
    // Если внешний текст на сегодня найдётся, он его заменит.
    renderOwn();
    loadExternal();
  }

  function todayKey(){
    const pad = n => String(n).padStart(2, '0');
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }

  function loadExternal(){
    if (typeof fetch !== 'function') return;
    let done = false;
    const stop = setTimeout(() => { done = true; }, 4000);   // ждём недолго, страница уже живая
    fetch('forecast.json', { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null))
      .then(data => {
        clearTimeout(stop);
        if (done || !data || !data.days) return;
        const text = data.days[todayKey()];
        if (typeof text === 'string' && text.trim().length > 10) renderExternal(text.trim());
      })
      .catch(() => {});   // нет файла, нет сети, сервис умер — остаётся свой вариант
  }

  // ---------- карточка на сохранение: тёмный и светлый (печатный) варианты ----------
  function wrapLines(ctx, text, maxWidth){
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words){
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Карточка рисуется в два прохода: сначала считаем высоту содержимого,
  // подбирая масштаб шрифтов, потом ставим блок по центру. Так ничего
  // не вылезает за край и не обрезается снизу при длинных фразах.
  function drawCard(mode){
    const W = 1080, H = 1350;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const dark = mode === 'dark';
    const bg     = dark ? '#0a0c16' : '#f7f2e7';
    const ink    = dark ? '#e9e4d8' : '#2c2a24';
    const inkDim = dark ? '#a79f8f' : '#6b6355';
    const rule   = dark ? 'rgba(233,228,216,.16)' : 'rgba(44,42,36,.18)';
    const gold   = '#b9985a';

    const marginX = 96;
    const contentW = W - marginX * 2;
    const colGap = 56;
    const colW = (contentW - colGap) / 2;

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    function serif(px, italic){ return (italic ? 'italic ' : '') + Math.round(px) + 'px Georgia, serif'; }

    function buildBlocks(k){
      const b = [];
      if (isBirthday){
        ctx.font = serif(40 * k);
        b.push({ t:'para', lines: wrapLines(ctx, FORECAST.birthdayMessage, contentW),
                 font: serif(40 * k), color: ink, lh: 60 * k });
      } else if (externalText){
        ctx.font = serif(38 * k);
        b.push({ t:'para', lines: wrapLines(ctx, externalText, contentW),
                 font: serif(38 * k), color: ink, lh: 56 * k });
      } else {
        themeBlocksData.forEach(function(item, i){
          b.push({ t:'line', text: item.theme.toUpperCase(), font: serif(22 * k),
                   color: gold, lh: 40 * k, gap: i ? 36 * k : 0 });
          ctx.font = serif(33 * k);
          b.push({ t:'para', lines: wrapLines(ctx, item.text, contentW),
                   font: serif(33 * k), color: ink, lh: 46 * k });
        });
        ctx.font = serif(27 * k);
        b.push({ t:'cols', gap: 58 * k,
                 doLines: doWordsToday.map(function(w){ return wrapLines(ctx, w, colW); }),
                 avLines: avoidWordsToday.map(function(w){ return wrapLines(ctx, w, colW); }),
                 headFont: serif(20 * k), font: serif(27 * k),
                 headLh: 44 * k, lh: 40 * k, itemGap: 12 * k });
      }
      return b;
    }

    function colHeight(lineSets, blk){
      let h = blk.headLh;
      for (let i = 0; i < lineSets.length; i++) h += lineSets[i].length * blk.lh + blk.itemGap;
      return h;
    }

    function measure(blocks){
      let h = 0;
      for (const blk of blocks){
        h += blk.gap || 0;
        if (blk.t === 'para') h += blk.lines.length * blk.lh;
        else if (blk.t === 'line') h += blk.lh;
        else if (blk.t === 'cols') h += Math.max(colHeight(blk.doLines, blk), colHeight(blk.avLines, blk));
      }
      return h;
    }

    const topLimit = 168, bottomLimit = H - 216;
    const available = bottomLimit - topLimit;
    let blocks = buildBlocks(1), used = measure(blocks);
    const scales = [1, 0.94, 0.88, 0.82, 0.76, 0.7];
    for (let i = 0; i < scales.length; i++){
      blocks = buildBlocks(scales[i]);
      used = measure(blocks);
      if (used <= available) break;
    }

    if (!isBirthday){
      ctx.fillStyle = inkDim;
      ctx.font = serif(22);
      ctx.fillText('ПРОГНОЗ ДНЯ', marginX, 108);
    }

    let y = topLimit + Math.max(0, (available - used) / 2);
    for (const blk of blocks){
      y += blk.gap || 0;
      if (blk.t === 'line'){
        y += blk.lh;
        ctx.font = blk.font; ctx.fillStyle = blk.color;
        ctx.fillText(blk.text, marginX, y);
      } else if (blk.t === 'para'){
        ctx.font = blk.font; ctx.fillStyle = blk.color;
        for (const line of blk.lines){ y += blk.lh; ctx.fillText(line, marginX, y); }
      } else if (blk.t === 'cols'){
        const startY = y;
        const draw = function(lineSets, title, x){
          let yy = startY + blk.headLh;
          ctx.font = blk.headFont; ctx.fillStyle = inkDim;
          ctx.fillText(title, x, yy);
          ctx.font = blk.font; ctx.fillStyle = ink;
          for (const lines of lineSets){
            for (const line of lines){ yy += blk.lh; ctx.fillText(line, x, yy); }
            yy += blk.itemGap;
          }
          return yy;
        };
        const yDo = draw(blk.doLines, 'ДЕЛАТЬ', marginX);
        const yAv = draw(blk.avLines, 'ИЗБЕГАТЬ', marginX + colW + colGap);
        y = Math.max(yDo, yAv);
      }
    }

    // подвал: тонкая линия, дата и — в обычный день — строка о Луне
    ctx.fillStyle = rule;
    ctx.fillRect(marginX, H - 168, contentW, 1);
    ctx.fillStyle = gold;
    ctx.font = serif(27);
    ctx.fillText(formatDate(now).toUpperCase(), marginX, H - 118);
    if (!isBirthday){
      ctx.fillStyle = inkDim;
      ctx.font = serif(22, true);
      const foot = wrapLines(ctx, smallPrintLine(), contentW);
      let fy = H - 80;
      for (let i = 0; i < foot.length && i < 2; i++){ ctx.fillText(foot[i], marginX, fy); fy += 30; }
      if (externalText){
        ctx.font = serif(19);
        ctx.fillText('ignio.com', W - marginX - ctx.measureText('ignio.com').width, H - 118);
      }
    }

    return canvas;
  }

  function flash(btn, text){
    if (!btn) return;
    const prev = btn.dataset.label || btn.textContent;
    btn.dataset.label = prev;
    btn.textContent = text;
    setTimeout(function(){ btn.textContent = btn.dataset.label || prev; }, 2200);
  }

  function downloadCanvas(canvas, filename, btn){
    // старые Safari и WebView не умеют toBlob или игнорируют download —
    // тогда просто открываем картинку, её можно сохранить удержанием
    if (!canvas.toBlob){
      try { window.open(canvas.toDataURL('image/png'), '_blank'); flash(btn, 'откройте картинку'); }
      catch(e){ flash(btn, 'не получилось'); }
      return;
    }
    canvas.toBlob(function(blob){
      if (!blob){ flash(btn, 'не получилось'); return; }
      const a = document.createElement('a');
      if (typeof a.download !== 'string'){
        try { window.open(URL.createObjectURL(blob), '_blank'); flash(btn, 'откройте картинку'); }
        catch(e){ flash(btn, 'не получилось'); }
        return;
      }
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      flash(btn, 'сохранено');
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    }, 'image/png');
  }

  function dateSlug(){
    const d = now;
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  if (saveDarkBtn) saveDarkBtn.addEventListener('click', function(){
    downloadCanvas(drawCard('dark'), `прогноз-${dateSlug()}.png`, saveDarkBtn);
  });
  if (saveLightBtn) saveLightBtn.addEventListener('click', function(){
    downloadCanvas(drawCard('light'), `прогноз-${dateSlug()}-печать.png`, saveLightBtn);
  });
});



/* ============================================================
   Сад — L-система на fixed canvas
   ============================================================ */

function buildPlant(seed, opts){
  const rand = mulberry32(seed);
  const segments = [];
  const flowers = [];
  const stemColors = ['#5c6650', '#6b7263', '#525a49', '#4f5647'];
  const stemColor = stemColors[Math.floor(rand() * stemColors.length)];

  function branch(x, y, angle, len, depth, t){
    if (depth <= 0 || len < opts.minLen || segments.length > opts.maxSegments){
      flowers.push({
        x, y, angle, t,
        size: opts.flowerSize * (0.7 + rand() * 0.6),
        color: MANDALA_PALETTE[Math.floor(rand() * MANDALA_PALETTE.length)]
      });
      return;
    }
    const wig = (rand() - 0.5) * 0.22;
    const a2 = angle + wig;
    const ex = x + Math.sin(a2) * len;
    const ey = y - Math.cos(a2) * len;
    segments.push({
      x1: x, y1: y, x2: ex, y2: ey, t, dur: opts.segDur,
      width: Math.max(1.1, depth * 1.5), color: stemColor
    });
    const nextLen = len * (0.7 + rand() * 0.12);
    const bAngle = (opts.angleMin + rand() * (opts.angleMax - opts.angleMin)) * Math.PI / 180;
    const nt = t + opts.segDur;
    const pattern = rand();
    if (pattern < opts.branchProb && depth > 1){
      branch(ex, ey, a2 + bAngle, nextLen * 0.85, depth - 1, nt);
      branch(ex, ey, a2 - bAngle, nextLen * 0.85, depth - 1, nt);
    } else {
      branch(ex, ey, a2 + (rand() - 0.5) * 0.18, nextLen, depth - 1, nt);
    }
  }

  branch(opts.x, opts.y, opts.angle, opts.startLen, opts.depth, 0);

  let maxT = 0.001;
  for (const s of segments) maxT = Math.max(maxT, s.t + s.dur);
  for (const f of flowers) maxT = Math.max(maxT, f.t + 1);
  for (const s of segments){ s.t0 = s.t / maxT; s.t1 = (s.t + s.dur) / maxT; s.committed = false; s.lastLen = 0; }
  for (const f of flowers){ f.t0 = f.t / maxT; f.bud = 0; f.done = false; }
  return { segments, flowers };
}

function drawFlower(ctx, f, p, easedFull){
  if (!easedFull){
    // бутон растёт
    ctx.fillStyle = 'rgba(90,95,75,0.8)';
    ctx.beginPath();
    ctx.arc(f.x, f.y, Math.max(0.5, f.size * 0.22 * p), 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  // полное раскрытие: лепестки вокруг сердцевины
  const n = 5;
  for (let i = 0; i < n; i++){
    const a = f.angle + (i / n) * Math.PI * 2;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(a);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(f.size * 0.32, -f.size * 0.5, 0, -f.size);
    ctx.quadraticCurveTo(-f.size * 0.32, -f.size * 0.5, 0, 0);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(230,210,150,0.9)';
  ctx.beginPath();
  ctx.arc(f.x, f.y, f.size * 0.16, 0, Math.PI * 2);
  ctx.fill();
}

function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }

safeInit('garden', function(){
  const canvas = document.getElementById('garden-canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let plants = [];
  let startTime = null;
  const GROWTH_MS = 55000;
  const BLOOM_MS = 900;

  function seedFromString(s){
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return h >>> 0;
  }

  function buildAllPlants(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const birthSeed = seedFromString(DATA.birth.replace(/-/g, '')); // 18091971
    const rand = mulberry32(Date.now() ^ Math.floor(Math.random() * 1e9));

    const commonOpts = {
      depth: 6, segDur: 1, minLen: 5, maxSegments: 140,
      angleMin: 20, angleMax: 30, branchProb: 0.6,
      flowerSize: Math.max(10, Math.min(20, W * 0.03))
    };

    plants = [];

    // её собственные, постоянные растения — seed от даты рождения
    plants.push(buildPlant(birthSeed, Object.assign({}, commonOpts, {
      x: W * 0.06, y: H, angle: 0.12, startLen: H * 0.09
    })));
    plants.push(buildPlant(birthSeed + 97, Object.assign({}, commonOpts, {
      x: W * 0.94, y: H, angle: -0.12, startLen: H * 0.09
    })));

    // случайные, каждый раз новые
    // без центральной точки: там идёт колонка текста
    const randomSpots = [0.16, 0.84, 0.0, 1.0, 0.28];
    const count = 3 + Math.floor(rand() * 2);
    for (let i = 0; i < count; i++){
      const fx = randomSpots[i % randomSpots.length] + (rand() - 0.5) * 0.05;
      const x = Math.max(4, Math.min(W - 4, fx * W));
      plants.push(buildPlant(Math.floor(rand() * 4294967295), Object.assign({}, commonOpts, {
        depth: 4 + Math.floor(rand() * 2),
        x, y: H, angle: (rand() - 0.5) * 0.3,
        startLen: H * (0.05 + rand() * 0.04)
      })));
    }

    startTime = null;
  }

  buildAllPlants();

  // На телефоне адресная строка прячется и показывается при каждом скролле,
  // и это шлёт resize десятками. Раньше сад пересобирался с нуля каждый раз
  // и не успевал вырасти. Теперь: мелкие изменения высоты игнорируем,
  // остальные — с задержкой и с сохранением уже пройденного роста.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    const dw = Math.abs(window.innerWidth - W);
    const dh = Math.abs(window.innerHeight - H);
    if (dw === 0 && dh < 140) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const grown = startTime === null ? 0 : (performance.now() - startTime);
      buildAllPlants();
      startTime = grown > 0 ? performance.now() - grown : null;
      // перерисовать некому, если анимация отключена или рост уже закончился
      if (REDUCED_MOTION || grown > GROWTH_MS * 1.4) renderInstant();
    }, 220);
  });

  function renderInstant(){
    for (const plant of plants){
      for (const s of plant.segments){
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        s.committed = true;
      }
      for (const f of plant.flowers){
        drawFlower(ctx, f, 1, true);
        f.done = true;
      }
    }
  }

  if (REDUCED_MOTION){
    renderInstant();
  } else {
    const gardenTicker = registerTicker((ts) => {
      if (startTime === null) startTime = ts;
      const elapsed = (ts - startTime) / GROWTH_MS;
      // всё выросло — освобождаем общий кадровый цикл
      if (elapsed > 1.4){ unregisterTicker(gardenTicker); return; }

      for (const plant of plants){
        for (const s of plant.segments){
          if (s.committed) continue;
          if (elapsed >= s.t1){
            ctx.strokeStyle = s.color;
            ctx.lineWidth = s.width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(s.x1, s.y1);
            ctx.lineTo(s.x2, s.y2);
            ctx.stroke();
            s.committed = true;
          } else if (elapsed > s.t0){
            const p = (elapsed - s.t0) / (s.t1 - s.t0);
            const ex = s.x1 + (s.x2 - s.x1) * p;
            const ey = s.y1 + (s.y2 - s.y1) * p;
            ctx.strokeStyle = s.color;
            ctx.lineWidth = s.width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(s.x1, s.y1);
            ctx.lineTo(ex, ey);
            ctx.stroke();
          }
        }
        for (const f of plant.flowers){
          if (f.done) continue;
          if (elapsed < f.t0) continue;
          const bloomP = (elapsed - f.t0) * GROWTH_MS / BLOOM_MS;
          if (bloomP >= 1){
            drawFlower(ctx, f, 1, true);
            f.done = true;
          } else {
            drawFlower(ctx, f, easeOutCubic(Math.min(1, bloomP)), false);
          }
        }
      }
    });
  }
});

safeInit('music', function(){
  const toggle = document.getElementById('sound-toggle');
  const vizCanvas = document.getElementById('music-viz');
  const dotsWrap = document.getElementById('music-dots');
  const endSection = document.getElementById('end-section');

  if (typeof Tone === 'undefined' || !toggle || !vizCanvas || !dotsWrap){
    return; // тихая деградация — сайт работает как обычно, без звука
  }

  toggle.hidden = false;

  // Кнопка стоит в правом нижнем углу и на первом экране накрывала правый край
  // ползунка часа: попытка ускорить ночь включала музыку. Прячем её, пока небо
  // занимает экран, и показываем, когда читатель уходит ниже.

  const vctx = vizCanvas.getContext('2d');

  // пентатоника D-E-G-A-B, три октавы (индексы 0..14)
  const PITCH_CLASSES = ['D', 'E', 'G', 'A', 'B'];
  const OCTAVES = [3, 4, 5];
  const SCALE = [];
  OCTAVES.forEach(oct => PITCH_CLASSES.forEach(pc => SCALE.push(pc + oct)));

  // точки под визуализацией — средние две октавы (10 нот)
  const DOT_NOTES = SCALE.slice(5);

  function colorForIndex(i){
    return MANDALA_PALETTE[i % MANDALA_PALETTE.length];
  }
  function hexToRgba(hex, a){
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  // ---------- звуковой граф ----------
  let enabled = false;
  let synth = null, master = null;
  let walkIndex = 7;
  let scheduledId = null;

  function buildAudio(){
    master = new Tone.Gain(0).toDestination();
    const reverb = new Tone.Reverb({ decay: 6, wet: 0.45 });
    const delay = new Tone.PingPongDelay({ delayTime: '8n.', feedback: 0.25, wet: 0.22 });
    delay.connect(reverb);
    reverb.connect(master);
    synth = new Tone.PolySynth(Tone.FMSynth, {
      harmonicity: 2,
      modulationIndex: 3,
      envelope: { attack: 0.6, decay: 1.2, sustain: 0.25, release: 3.5 },
      modulationEnvelope: { attack: 0.4, decay: 0.8, sustain: 0.1, release: 2 },
      volume: -18
    });
    synth.connect(delay);
  }

  // Флаг started давал гонку: второй быстрый тап получал resolve раньше,
  // чем buildAudio успевал создать синтезатор. Держим один общий промис.
  let readyPromise = null;
  function ensureAudioReady(){
    if (readyPromise) return readyPromise;
    readyPromise = Tone.start().then(buildAudio).catch((e) => {
      readyPromise = null;
      throw e;
    });
    return readyPromise;
  }

  function pickGap(){
    const r = Math.random();
    if (r < 0.06) return 5 + Math.random() * 2;          // редкая долгая тишина
    if (r < 0.14) return 0.05 + Math.random() * 0.15;    // почти одновременная нота
    return 0.8 + Math.random() * 2.2;                     // обычный интервал
  }

  function stepWalk(){
    const r = Math.random();
    let step;
    if (r < 0.12){
      step = (Math.random() < 0.5 ? -1 : 1) * (4 + Math.floor(Math.random() * 3)); // редкий скачок
    } else {
      step = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 2)); // обычно 1-2 шага
    }
    walkIndex = Math.max(0, Math.min(SCALE.length - 1, walkIndex + step));
    return walkIndex;
  }

  function playNote(idx, opts){
    opts = opts || {};
    if (!synth) return;
    const note = SCALE[idx];
    const vel = 0.35 + Math.random() * 0.5;
    const dur = opts.dur || (1.2 + Math.random() * 1.8);
    try { synth.triggerAttackRelease(note, dur, undefined, vel); }
    catch(e){ /* тихо игнорируем сбой синтеза одной ноты */ }
    spawnRing(idx, vel);
  }

  // Номер поколения: два быстрых нажатия раньше запускали две параллельные
  // цепочки нот, а clearTimeout помнил только последнюю
  let generation = 0;

  function scheduleNext(gen){
    if (!enabled || gen !== generation) return;
    const gap = pickGap();
    scheduledId = setTimeout(() => {
      if (!enabled || gen !== generation) return;
      playNote(stepWalk());
      scheduleNext(gen);
    }, gap * 1000);
  }

  function setEnabled(next){
    return ensureAudioReady().then(() => {
      if (!synth) return;
      enabled = next;
      const gen = ++generation;
      toggle.setAttribute('aria-pressed', String(enabled));
      updateToggleVisibility();   // при включённом звуке кнопка видна везде
      if (scheduledId){ clearTimeout(scheduledId); scheduledId = null; }
      const now = Tone.now();
      // фиксируем текущее значение, иначе рампа стартует с прежней цели и щёлкает
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      if (enabled){
        master.gain.linearRampToValueAtTime(1, now + 2.2);
        scheduleNext(gen);
      } else {
        master.gain.linearRampToValueAtTime(0, now + 1.4);
      }
    }).catch(() => {});
  }

  let userTouchedSound = false;
  toggle.addEventListener('click', () => { userTouchedSound = true; setEnabled(!enabled); });

  // Автозапуск. Браузеры не дают включить звук до первого действия человека —
  // это их правило безопасности, обойти его нельзя. Поэтому музыка стартует
  // при самом первом касании или клике по странице, что бы это ни было:
  // прокрутка пальцем, нажатие на ползунок часа, тап по пустому месту.
  // Прокрутка колесом и клавиши тоже считаются жестом, скролл сам по себе — нет.
  function autostart(){
    if (userTouchedSound || enabled) return;
    setEnabled(true);
  }
  const AUTOSTART_EVENTS = ['pointerdown', 'touchend', 'keydown', 'wheel'];
  function armAutostart(){
    AUTOSTART_EVENTS.forEach(ev =>
      window.addEventListener(ev, onFirstGesture, { once: true, passive: true }));
  }
  function onFirstGesture(){
    AUTOSTART_EVENTS.forEach(ev => window.removeEventListener(ev, onFirstGesture));
    autostart();
  }
  armAutostart();
  // Кнопка висит в правом нижнем углу и на первом экране накрывала ползунок
  // часа, а на прогнозе — последнюю строку списка. Музыка живёт в финале,
  // поэтому там она и появляется; если звук включён, остаётся видимой всегда,
  // чтобы его можно было выключить с любого места страницы.
  let endInView = false;
  function updateToggleVisibility(){
    toggle.classList.toggle('is-tucked', !endInView && !enabled);
  }
  if ('IntersectionObserver' in window){
    updateToggleVisibility();
    const endIo = new IntersectionObserver((entries) => {
      entries.forEach(en => { endInView = en.isIntersecting; });
      updateToggleVisibility();
    }, { threshold: 0.12 });
    endIo.observe(endSection);
  }

  // На iOS звук засыпает вместе со свёрнутой вкладкой и сам не возвращается:
  // кнопка горит «включено», а тишина
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && enabled && window.Tone && Tone.context && Tone.context.state === 'suspended'){
      Tone.context.resume().catch(() => {});
    }
  });

  DOT_NOTES.forEach((note) => {
    const idx = SCALE.indexOf(note);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'music-dot';
    btn.setAttribute('aria-label', 'нота ' + (SCALE.indexOf(note) + 1));
    let lastTrigger = 0;
    // только click: touchstart с preventDefault не давал прокрутить страницу,
    // если палец начинал свайп на точке
    const trigger = () => {
      const t = Date.now();
      if (t - lastTrigger < 120) return;
      lastTrigger = t;
      ensureAudioReady().then(() => {
        if (!enabled) setEnabled(true);
        playNote(idx, { dur: 1.6 });
      }).catch(() => {});
    };
    btn.addEventListener('click', trigger);
    dotsWrap.appendChild(btn);
  });

  // ---------- визуализация ----------
  let vizVisible = true;
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => { vizVisible = en.isIntersecting; });
    }, { threshold: 0.05 });
    io.observe(endSection);
  }

  let rings = [];
  const RING_MS = 3200;

  function spawnRing(idx, vel){
    const t = SCALE.length - 1;
    rings.push({ born: performance.now(), yFrac: 1 - idx / t, color: colorForIndex(idx), strength: vel });
    if (rings.length > 24) rings.shift();
    if (REDUCED_MOTION) drawFrame();
  }

  function resizeViz(){
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    const w = vizCanvas.clientWidth, h = vizCanvas.clientHeight;
    vizCanvas.width = Math.round(w * DPR);
    vizCanvas.height = Math.round(h * DPR);
    vctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resizeViz();
  window.addEventListener('resize', () => { resizeViz(); drawFrame(); });
  drawFrame();

  function drawFrame(){
    const w = vizCanvas.clientWidth, h = vizCanvas.clientHeight;
    vctx.clearRect(0, 0, w, h);
    const now = performance.now();
    rings = rings.filter(r => now - r.born < RING_MS);

    // пока нот нет, экран был совсем пустой: оставляем тихое дыхание,
    // чтобы у финала была точка, к которой возвращается взгляд
    if (!rings.length){
      const breath = REDUCED_MOTION ? 0.5 : 0.5 + 0.5 * Math.sin(now / 2600);
      vctx.beginPath();
      vctx.strokeStyle = 'rgba(185,152,90,' + (0.10 + breath * 0.12).toFixed(3) + ')';
      vctx.lineWidth = 1;
      vctx.arc(w / 2, h / 2, 15 + breath * 11, 0, Math.PI * 2);
      vctx.stroke();
    }
    for (const r of rings){
      const p = (now - r.born) / RING_MS;
      const radius = 6 + p * (Math.min(w, h) * 0.42) * (0.6 + r.strength * 0.6);
      const alpha = (1 - p) * 0.5 * (0.5 + r.strength * 0.5);
      vctx.beginPath();
      vctx.strokeStyle = hexToRgba(r.color, alpha);
      vctx.lineWidth = 1.4;
      vctx.arc(w / 2, h * (0.12 + r.yFrac * 0.76), radius, 0, Math.PI * 2);
      vctx.stroke();
    }
  }

  if (!REDUCED_MOTION){
    registerTicker(() => { if (vizVisible) drawFrame(); });
  }
});
</script>

</body>
</html>
